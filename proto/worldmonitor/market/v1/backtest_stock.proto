syntax = "proto3";

package worldmonitor.market.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";

message BacktestStockEvaluation {
  int64 analysis_at = 1 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  string signal = 2;
  double signal_score = 3;
  double entry_price = 4;
  double exit_price = 5;
  double simulated_return_pct = 6;
  bool direction_correct = 7;
  string outcome = 8;
  double stop_loss = 9;
  double take_profit = 10;
  string analysis_id = 11;
}

message BacktestStockRequest {
  // Stock ticker symbol to backtest.
  string symbol = 1 [(sebuf.http.query) = { name: "symbol" },
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];

  // Optional company display name used to disambiguate the symbol.
  string name = 2 [
    (sebuf.http.query) = { name: "name" },
    (buf.validate.field).string.max_len = 120
  ];

  // Evaluation window in days for simulated backtest outcomes.
  int32 eval_window_days = 3 [
    (sebuf.http.query) = { name: "eval_window_days" },
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32.gte = 3,
    (buf.validate.field).int32.lte = 30
  ];
}

message BacktestStockResponse {
  bool available = 1;
  string symbol = 2;
  string name = 3;
  string display = 4;
  string currency = 5;
  int32 eval_window_days = 6;
  int32 evaluations_run = 7;
  int32 actionable_evaluations = 8;
  // The five simulated-performance metrics are OPTIONAL and are omitted
  // whenever `available` is false. They are measurements, not counters: a
  // hard 0 on an unavailable response reads as "0% win rate" to any consumer
  // that skips the `available` check, which is a fabricated measurement.
  // Absent means "not measured"; present means "measured, possibly 0".
  optional double win_rate = 9;
  optional double direction_accuracy = 10;
  optional double avg_simulated_return_pct = 11;
  optional double cumulative_simulated_return_pct = 12;
  string latest_signal = 13;
  optional double latest_signal_score = 14;
  string summary = 15;
  string generated_at = 16;
  repeated BacktestStockEvaluation evaluations = 17;
  string engine_version = 18;
  // "technical_only": historical Yahoo bars do not include point-in-time
  // fundamentals, so this result must not be presented as a replay of the
  // fundamentals-blended live rating.
  string rating_basis = 19;
}
