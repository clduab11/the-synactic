# =============================================================================
# World Monitor — Docker / Podman Compose
# =============================================================================
# Self-contained stack: app + Redis + AIS relay.
#
# Quick start:
#   cp .env.example .env        # add your API keys
#   docker compose up -d --build
#
# The app will be available at http://localhost:3000
# =============================================================================

# Project name pinned: compose otherwise derives it from the directory name,
# and the 2026-07-30 rename (worldmonitor-fork → the-synactic) would have
# switched the project to "the-synactic" — abandoning the existing containers
# AND silently creating a fresh empty redis-data volume (orphaning every
# seeded key). The running stack, its labels, and worldmonitor_redis-data
# stay continuous under the original name.
name: the-synactic

services:

  the-synactic:
    build:
      context: .
      dockerfile: Dockerfile
    image: the-synactic:latest
    container_name: the-synactic
    ports:
      # Loopback by default. nginx stamps SELFHOST_PREMIUM_KEY onto every /api/
      # request (docker/entrypoint.sh), so a published 0.0.0.0 bind hands any host
      # that can route here fully-authenticated access to the whole MCP surface and
      # every premium route — no credential required. Matches redis-rest below.
      # Set WM_BIND=0.0.0.0 to deliberately expose it (e.g. viewing from a phone).
      - "${WM_BIND:-127.0.0.1}:${WM_PORT:-3000}:8080"
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      LOCAL_API_CLOUD_FALLBACK: "false"
      WS_RELAY_URL: "http://ais-relay:3004"
      # Shared secret the app presents on non-public relay routes
      # (server/_shared/relay.ts). Must match the ais-relay service's value.
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:-}"
      # Comma-separated operator MCP keys (api/mcp/auth.ts env_key class —
      # ungated and unmetered on a self-host; presented via X-WorldMonitor-Key).
      # Keep DISTINCT from WORLDMONITOR_RELAY_KEY (server/gateway.ts says the
      # relay warm-ping secret should not be a valid key).
      WORLDMONITOR_VALID_KEYS: "${WORLDMONITOR_VALID_KEYS:-}"
      # ADV-34: when set, nginx attaches this key to browser-origin /api/ calls so
      # premium RPC routes return real data instead of empty payloads. Must be one
      # of WORLDMONITOR_VALID_KEYS above. Pairs with VITE_SELFHOST_PRO=1 (build
      # time) which removes the matching UI padlocks. Unset = current behavior.
      # NOTE: the dashboard port is published on all interfaces, so setting this
      # grants premium API access to anything that can reach the port.
      SELFHOST_PREMIUM_KEY: "${SELFHOST_PREMIUM_KEY:-}"
      # Widget agent (ADV-34): same shared secret the ais-relay service holds,
      # plus the local relay base so api/widget-agent.ts stops proxying to
      # proxy.worldmonitor.app. The gateway also validates WIDGET_AGENT_KEY for
      # usage telemetry attribution (server/gateway.ts:737-740).
      WIDGET_AGENT_KEY: "${WIDGET_AGENT_KEY:-}"
      PRO_WIDGET_KEY: "${PRO_WIDGET_KEY:-}"
      WIDGET_RELAY_BASE: "${WIDGET_RELAY_BASE:-}"
      # Seed-only refresh credential for the resilience-ranking recompute path
      # (gateway isResilienceRankingSeedRefreshRequest; seed-resilience-scores.mjs
      # FATALs without it and the gateway must hold the same value).
      WORLDMONITOR_SEED_REFRESH_KEY: "${WORLDMONITOR_SEED_REFRESH_KEY:-}"
      # Relay warm-ping credential (server/gateway.ts RELAY_WARM_PING_PATHS).
      # The cii-warmer one-shot below presents this as X-WorldMonitor-Key to
      # authenticate its warm GET of /api/intelligence/v1/get-risk-scores.
      # REQUIRED for the cii-warmer to function: without it the warmer exits
      # AUTH REQUIRED and the CII cold-start deadlock persists (the endpoint
      # is auth-gated even on self-host). Generate: openssl rand -hex 32 → .env
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:-}"
      # LLM provider (any OpenAI-compatible endpoint)
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # Data source API keys (optional — features degrade gracefully)
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      ACLED_PASSWORD: "${ACLED_PASSWORD:-}"
      ACLED_ACCESS_TOKEN: "${ACLED_ACCESS_TOKEN:-}"
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
      TRAVELPAYOUTS_API_TOKEN: "${TRAVELPAYOUTS_API_TOKEN:-}"
      # Session-09 [2b]: local intel-history backend. Routes the three history
      # RPCs (search-intel-history / get-intel-timeline / get-similar-events)
      # to the `chroma` service below instead of Convex — this self-host
      # deliberately leaves CONVEX_SITE_URL unset, which otherwise pins those
      # tools at upstreamUnavailable forever. Query embedding goes to the
      # operator's local OpenAI-compatible endpoint (LM Studio on the host);
      # INTEL_EMBED_MODEL/DIMS MUST match what scripts/_seed-history.mjs wrote
      # into the collection, or ranking is silently meaningless. Both origins
      # are private-network, so the sidecar's docker-mode SSRF allowlist reads
      # these SAME env names (src-tauri/sidecar/local-api-server.mjs).
      INTEL_HISTORY_BACKEND: "${INTEL_HISTORY_BACKEND:-chroma}"
      CHROMA_URL: "${CHROMA_URL:-http://chroma:8000}"
      INTEL_EMBED_BASE_URL: "${INTEL_EMBED_BASE_URL:-http://host.docker.internal:1234/v1}"
      INTEL_EMBED_MODEL: "${INTEL_EMBED_MODEL:-text-embedding-nomic-embed-text-v1.5}"
      INTEL_EMBED_DIMS: "${INTEL_EMBED_DIMS:-768}"
    # Docker Desktop resolves host.docker.internal natively; the explicit
    # host-gateway mapping keeps the LM Studio embed path working under plain
    # Linux dockerd too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Docker secrets (recommended for API keys — keeps them out of docker inspect).
    # Create secrets/ dir with one file per key, then uncomment below.
    # See SELF_HOSTING.md or docker-compose.override.yml for details.
    # secrets:
    #   - GROQ_API_KEY
    #   - AISSTREAM_API_KEY
    #   - FINNHUB_API_KEY
    #   - FRED_API_KEY
    #   - NASA_FIRMS_API_KEY
    #   - LLM_API_KEY
    depends_on:
      redis-rest:
        condition: service_started
      ais-relay:
        condition: service_started
      # Startup ordering only. A stopped/failed chroma must DEGRADE the three
      # history tools to upstreamUnavailable:true, never block the app —
      # service_started does not gate on health.
      chroma:
        condition: service_started
    restart: unless-stopped

  # One-shot CII warmer — breaks the cold-start deadlock: get_country_risk
  # reads ONLY risk:scores:sebuf:stale:v8 and no seeder writes it; one GET to
  # the local get-risk-scores endpoint populates it (TTL 3600s). Runs once on
  # `docker compose up -d` and exits; runs again on the next up. Inspect with:
  #   docker compose logs cii-warmer
  # After the warm GET the script reads the stale key back through redis-rest
  # and exits non-zero if it is absent — an HTTP 200 alone does NOT prove the
  # write (the degraded path answers 200 without persisting). Exit codes:
  # 0 warmed+verified; 1 warm failed, key absent, or key present but corrupt
  # (deadlock persists); 2 warmed but unverified — shim unreachable, token
  # rejected, or malformed shim reply (write state unknown, NOT a deadlock
  # verdict).
  # Same image as the app (shared build — no extra pull); the warmer script is
  # bind-mounted from the repo so no rebuild is needed when it changes.
  cii-warmer:
    build:
      context: .
      dockerfile: Dockerfile
    image: the-synactic:latest
    container_name: the-synactic-cii-warmer
    command: ["node", "/tmp/warm-cii-stale.mjs"]
    volumes:
      - ./scripts/warm-cii-stale.mjs:/tmp/warm-cii-stale.mjs:ro
    environment:
      CII_WARM_URL: "http://the-synactic:8080/api/intelligence/v1/get-risk-scores"
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:-}"
      # Write-verification path. In-network address — the host-published
      # 127.0.0.1:8079 is this container's OWN loopback and always refuses.
      # CII_WARM_* (not UPSTASH_*): the script deliberately ignores the
      # UPSTASH_ pair so a hybrid .env carrying hosted Upstash creds can
      # never point verification at production Redis (see the script header).
      CII_WARM_REDIS_URL: "http://redis-rest:80"
      CII_WARM_REDIS_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
    depends_on:
      the-synactic:
        condition: service_started
      redis-rest:
        condition: service_started
    restart: "no"
    # The app image's HEALTHCHECK probes the node sidecar on 8080, which does
    # not run in this container — without this override the warmer reports
    # "unhealthy" forever while working correctly.
    healthcheck:
      disable: true

  # ADV-28: the stale CII key expires hourly (RISK_STALE_TTL = 3600,
  # get-risk-scores.ts:1417) and the one-shot cii-warmer above is a bootstrap
  # step, not a keeper — a few hours after any warm the key is gone and
  # get_country_risk fails closed again. This sibling keeps it warm as a
  # recurring job: re-warm every 45 min on success (15-min margin inside the
  # 60-min TTL), retry in 5 min on any non-zero exit (a transient failure must
  # not open an hour-long cold window; exit 2 = warmed-but-unverified also
  # retries until verification passes). The one-shot service above stays for
  # on-demand verified warms (`docker compose run --rm cii-warmer`, exit 0 =
  # warmed+verified). Inline `sh -c` loop on purpose: a bind-mounted .sh
  # entrypoint would be CRLF on a Windows checkout and exit 127.
  cii-warmer-loop:
    build:
      context: .
      dockerfile: Dockerfile
    image: the-synactic:latest
    container_name: the-synactic-cii-warmer-loop
    command: ["sh", "-c", "while true; do if node /tmp/warm-cii-stale.mjs; then sleep 2700; else sleep 300; fi; done"]
    volumes:
      - ./scripts/warm-cii-stale.mjs:/tmp/warm-cii-stale.mjs:ro
    environment:
      CII_WARM_URL: "http://the-synactic:8080/api/intelligence/v1/get-risk-scores"
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:-}"
      # Same CII_WARM_* isolation rule as the one-shot above: the script
      # deliberately ignores UPSTASH_* so hosted creds in a hybrid .env can
      # never point verification at production Redis.
      CII_WARM_REDIS_URL: "http://redis-rest:80"
      CII_WARM_REDIS_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
    depends_on:
      the-synactic:
        condition: service_started
      redis-rest:
        condition: service_started
    restart: unless-stopped
    # Same as the one-shot: no sidecar in this container, so the inherited
    # image HEALTHCHECK can never pass.
    healthcheck:
      disable: true

  # ADV-16: recurring short-TTL seeder cadence. Six bootstrap keys carry 2-3h
  # TTLs (aviation:delays-bootstrap:v2 7200, radiation:observations:v1 7200,
  # cyber:threats-bootstrap:v2 10800, prediction:markets-bootstrap:v1 10800,
  # intelligence:advisories:v1 10800, infra:outages:v1 10800) and this box has
  # no host seeder schedule — every one lapses a few hours after the last
  # manual run, and four of them made their MCP tools hard-error with
  # cache_all_null (2026-07-30 sweep). advisories is doubly acute: it is a
  # get_country_risk gate key whose lapse masquerades as the Trap-5 deadlock.
  # 45-min cadence = >=2.6x refresh margin on the shortest TTL while staying
  # gentler than upstream's own 30-min crons for aviation/prediction-markets.
  # ORDER MATTERS at the tail: seed-natural-events writes natural:events:v1, and
  # seed-climate-disasters now reads it as its SOLE source (ReliefWeb was removed
  # 2026-08-03). Natural-events must therefore run first within a cycle, or the
  # disasters seed fails its first pass on a cold cache.
  # The ten seeders are dependency-free pure Node (verified: only node:*
  # builtins + ./scripts-relative imports), so bind-mounting scripts/ + shared/
  # suffices — no node_modules, no rebuild on seeder edits. busybox `timeout`
  # bounds a hung seeder so one stall cannot stop the whole cadence. Inline
  # sh -c on purpose: a bind-mounted .sh would materialise CRLF on a Windows
  # checkout and exit 127 (same rationale as cii-warmer-loop).
  seed-loop:
    build:
      context: .
      dockerfile: Dockerfile
    image: the-synactic:latest
    container_name: the-synactic-seed-loop
    command: ["sh", "-c", "while true; do for s in seed-security-advisories seed-aviation seed-cyber-threats seed-prediction-markets seed-radiation-watch seed-internet-outages seed-defcon-level seed-fire-detections seed-natural-events seed-climate-disasters seed-kraken-markets; do echo \"[seed-loop] running $$s\"; timeout 1800 node /repo/scripts/$$s.mjs || echo \"[seed-loop] $$s FAILED (exit $$?)\"; done; echo '[seed-loop] cycle done; sleeping 45min'; sleep 2700; done"]
    volumes:
      - ./scripts:/repo/scripts:ro
      - ./shared:/repo/shared:ro
      # seed-aviation parses src/config/airports.ts (text-parse, not import) to
      # merge the RPC airport registry; without it the bootstrap silently
      # narrows from 133 to 106 airports ("falling back to seeder AIRPORTS").
      - ./src/config:/repo/src/config:ro
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      # seed-internet-outages skips politely without this (CF Radar auth).
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      # seed-aviation's intl leg is AviationStack-budgeted (MONTHLY_BUDGET
      # guards in-script); absent key degrades gracefully to FAA-only.
      AVIATIONSTACK_API: "${AVIATIONSTACK_API:-}"
      # seed-fire-detections HARD-EXITS 1 without this (scripts/seed-fire-detections.mjs:148-151)
      # — it does not degrade. One run issues 27 requests (3 satellites x 9
      # regions), paced 6s apart in-script, so ~3.2 min best case and ~32.4 min
      # worst case; that worst case is why the per-seeder timeout above is 1800s
      # and not 900s. Well inside the MAP_KEY ceiling of 5000 per 10 min.
      NASA_FIRMS_API_KEY: "${NASA_FIRMS_API_KEY:-}"
      # Session-09 [2b]: intel-history write path. The three history-writing
      # seeders (seed-conflict-intel, seed-cross-strait-activity,
      # seed-energy-intelligence) are run in THIS container (`docker compose
      # exec -T seed-loop node /repo/scripts/<name>.mjs`) so their
      # afterPublish hooks embed via LM Studio on the host and upsert into the
      # chroma service. Same values as the app container — reads and writes
      # must share one store and one vector space. No SSRF guard here: plain
      # node, no sidecar.
      INTEL_HISTORY_BACKEND: "${INTEL_HISTORY_BACKEND:-chroma}"
      CHROMA_URL: "${CHROMA_URL:-http://chroma:8000}"
      INTEL_EMBED_BASE_URL: "${INTEL_EMBED_BASE_URL:-http://host.docker.internal:1234/v1}"
      INTEL_EMBED_MODEL: "${INTEL_EMBED_MODEL:-text-embedding-nomic-embed-text-v1.5}"
      INTEL_EMBED_DIMS: "${INTEL_EMBED_DIMS:-768}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis-rest:
        condition: service_started
    restart: unless-stopped
    # Same as cii-warmer-loop: worker container on the app image, no sidecar,
    # inherited HEALTHCHECK can never pass.
    healthcheck:
      disable: true

  # ── Second seeder tier (session 09) ─────────────────────────────────────────
  # A SLOW companion to seed-loop, for sources whose staleness budget is hours
  # rather than minutes and whose upstreams are rate-limited.
  #
  # WHY A SEPARATE TIER AND NOT MORE ENTRIES IN seed-loop: the 45-minute loop is
  # already ~35 min of work worst case (FIRMS alone can take 32). Appending
  # slow, retry-heavy seeders would push the cycle past its own sleep and the
  # fast layers would start missing their budgets.
  #
  # MEMBERSHIP IS DELIBERATE — each of these was run and diagnosed 2026-08-03:
  #   - seed-sanctions-pressure: was crashing with ERR_MODULE_NOT_FOUND ('sax'
  #     missing from the slim runtime image; fixed by adding it to
  #     docker/runtime-package.json). Budget is 720 min, so 3h is 4x headroom.
  #   - seed-climate-zone-normals -> seed-climate-anomalies: an ORDERED chain.
  #     The anomaly seeder refuses to run without the climate:zone-normals:v1
  #     baseline and says so by name. Open-Meteo currently 429s the baseline
  #     fetch, so this pair is here to retry POLITELY on a long cadence until
  #     the throttle clears — per CONTEXT.md boundary 2, back off, never cycle
  #     identities to get around a published limit.
  #
  # DELIBERATELY NOT HERE, and this is the interesting part:
  #   - seed-insights (works) has maxStaleMin 30 and seed-forecasts (works) has
  #     maxStaleMin 90 (api/health.js). On a 3h cadence BOTH would report
  #     STALE_SEED permanently — the budget, not the convenience, sets the
  #     cadence. They also both spend LLM credits per run, so the
  #     freshness-vs-cost tradeoff is an owner decision, not a default.
  #   - seed-gdelt-intel / seed-unrest-events: GDELT's doc API is returning 429
  #     to this host (its masterfilelist returns 200, so this is throttling, not
  #     an outage) and unrest additionally needs ACLED credentials the fork does
  #     not hold (boundary 3). Scheduling them harder would be exactly the
  #     quota-evasion posture boundary 2 rules out.
  seed-loop-slow:
    build:
      context: .
      dockerfile: Dockerfile
    image: the-synactic:latest
    container_name: the-synactic-seed-loop-slow
    command: ["sh", "-c", "while true; do for s in seed-sanctions-pressure seed-climate-zone-normals seed-climate-anomalies seed-economy seed-eia-petroleum seed-unrest-events; do echo \"[seed-loop-slow] running $$s\"; timeout 1800 node /repo/scripts/$$s.mjs || echo \"[seed-loop-slow] $$s FAILED (exit $$?)\"; done; echo '[seed-loop-slow] cycle done; sleeping 3h'; sleep 10800; done"]
    volumes:
      - ./scripts:/repo/scripts:ro
      - ./shared:/repo/shared:ro
      - ./src/config:/repo/src/config:ro
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      # Free-tier keys, provisioned by the operator 2026-08-03. Until then the
      # FRED and EIA layers were EMPTY, not broken — seed-economy degrades
      # politely without them, so nothing failed loudly and 14 health checks
      # simply never populated. They are passed HERE (not only to the app
      # container, which already had them) because the seeders that consume
      # them run in this container.
      #   FRED  -> economic:fred:v1:* (fredBatch + 9 forecastFred* checks)
      #   EIA   -> crude inventories, nat-gas storage, petroleum, refinery
      # Cadence: these are daily-cron-shaped upstreams (health budgets are
      # 1500 min / 25h), so a 3h loop is generous headroom, not pressure —
      # well inside both providers' published limits.
      FRED_API_KEY: "${FRED_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      # ACLED — CLEARED for use 2026-08-03 (CONTEXT.md boundary 3, v8): the
      # publisher's AI/LLM restriction is scoped to TRAINING, not inference,
      # confirmed by the owner with ACLED's CIO office. The fixture default is
      # now an OPERATIONAL safety (no credentials yet, and live mode would fail
      # closed), not a licensing gate.
      #
      # To go live, set all four in .env — nothing else needs to change:
      #   ACLED_MODE=live  plus  ACLED_EMAIL + ACLED_PASSWORD  (or
      #   ACLED_ACCESS_TOKEN). scripts/_acled-source.mjs:31 defaults to fixture.
      # ⚠ ACLED assigns API tier by EMAIL DOMAIN — a generic address lands on
      # the Open tier, which has NO API at all, so the credential must come
      # from a tier that actually carries API rights.
      #
      # These live HERE and not only on the app container for the same reason
      # FRED/EIA did: the seeders that consume them run in this container.
      ACLED_MODE: "${ACLED_MODE:-fixture}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      ACLED_PASSWORD: "${ACLED_PASSWORD:-}"
      ACLED_ACCESS_TOKEN: "${ACLED_ACCESS_TOKEN:-}"
    depends_on:
      redis-rest:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      disable: true

  # Session-09 [2b]: local vector store for the intel-history surface.
  # Replaces Convex as the durable store behind search_intel_history /
  # get_intel_timeline / get_similar_events on this self-host (CONVEX_SITE_URL
  # is deliberately unset here). One collection, `intel-history-v1`, cosine
  # space, 768-dim nomic vectors; written by the three history seeders via
  # scripts/_seed-history.mjs, read by server/_shared/intel-history-local.ts.
  # Pinned tag (latest stable at pin time), never :latest — a silent major bump
  # could change the v2 REST surface under the baked handlers.
  # Host bind is loopback-only on 8000 (verified free on this box; 8080 is
  # FORBIDDEN — SearXNG rule) purely for operator curl access; containers reach
  # it as http://chroma:8000. The image persists to /data (its /config.yaml)
  # on the chroma-data named volume — the `name: the-synactic` project pin at
  # the top of this file is what protects named volumes from the rename-
  # orphaning accident, so keep that pin if you ever touch project naming.
  # Healthcheck uses bash /dev/tcp because the image ships no curl/wget.
  chroma:
    image: docker.io/chromadb/chroma:1.5.9
    container_name: the-synactic-chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/healthcheck HTTP/1.0\\r\\n\\r\\n' >&3 && head -c 200 <&3 | grep -q '200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ais-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: the-synactic-ais-relay:latest
    container_name: the-synactic-ais-relay
    environment:
      # The relay FATALs at boot without this (scripts/ais-relay.cjs) unless
      # I_UNDERSTAND_THIS_DISABLES_AUTH=true — fail compose validation early
      # instead of shipping a restart-looping container. SELF_HOSTING.md
      # documents it as required.
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required — generate with: openssl rand -hex 32}"
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      # Reddit social-velocity path (ais-relay.cjs reads it; the public Reddit
      # endpoint 403s, so without this the relay writes recordCount:0 seed-meta
      # forever and get_social_velocity hard-errors with cache_all_null).
      SCRAPECREATORS_API_KEY: "${SCRAPECREATORS_API_KEY:-}"
      MARKET_YAHOO_REFRESH_INTERVAL_MS: "${MARKET_YAHOO_REFRESH_INTERVAL_MS:-900000}"
      # Cable-health warm-ping. Without these the relay POSTed the HOSTED URL
      # and 401'd ("WORLDMONITOR_RELAY_KEY not set"), so local cable-health-v1
      # was never written and health.js reported STALE_SEED indefinitely.
      # The key IS in .env but was simply never passed to this service.
      CABLE_HEALTH_WARM_URL: "http://the-synactic:8080/api/infrastructure/v1/get-cable-health"
      WORLDMONITOR_RELAY_KEY: "${WORLDMONITOR_RELAY_KEY:-}"
      # Widget agent (ADV-34). This relay IS the widget-agent backend that
      # proxy.worldmonitor.app deploys — /widget-agent lives here, so a self-host
      # needs no second implementation, just credentials. WIDGET_AGENT_KEY is the
      # shared secret the app's api/widget-agent.ts presents as X-Widget-Key.
      # ANTHROPIC_API_KEY + WIDGET_ANTHROPIC_BASE_URL point the Anthropic SDK at
      # the operator's own LiteLLM gateway (verified to carry tool_use and the
      # Anthropic SSE sequence), so WIDGET_AGENT_MODEL must name a model that
      # gateway actually serves. All unset -> hosted defaults, relay unchanged.
      WIDGET_AGENT_KEY: "${WIDGET_AGENT_KEY:-}"
      # The dashboard's "Create Interactive Widget" CTA requests tier:'pro'
      # (panel-layout.ts), and the relay 503s "PRO widget agent unavailable"
      # without this second, distinct secret (ais-relay.cjs:10880).
      PRO_WIDGET_KEY: "${PRO_WIDGET_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      WIDGET_ANTHROPIC_BASE_URL: "${WIDGET_ANTHROPIC_BASE_URL:-}"
      WIDGET_AGENT_MODEL: "${WIDGET_AGENT_MODEL:-}"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      UPSTASH_ALLOW_INSECURE_HTTP: "true"
      UCDP_ACCESS_TOKEN: "${UCDP_ACCESS_TOKEN:-}"
      PORT: "3004"
    depends_on:
      redis-rest:
        condition: service_started
    restart: unless-stopped

  redis:
    image: docker.io/redis:7-alpine
    container_name: the-synactic-redis
    # --requirepass closes off the network so any future sidecar / compromised
    # dependency added to the worldmonitor network can't read or write cache
    # entries without the password. Defense-in-depth alongside the REST token.
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required — generate with: openssl rand -hex 32}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redis-rest:
    build:
      context: docker
      dockerfile: Dockerfile.redis-rest
    image: the-synactic-redis-rest:latest
    container_name: the-synactic-redis-rest
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required — generate with: openssl rand -hex 32}"
      # Defense-in-depth: the redis service's --requirepass already fails
      # compose validation if REDIS_PASSWORD is unset, but the explicit
      # :? here protects against a future PR removing --requirepass or
      # copying this connection string into a new service.
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required — generate with: openssl rand -hex 32}@redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

# Docker secrets — uncomment and point to your secret files.
# Example: echo "gsk_abc123" > secrets/groq_api_key.txt
# secrets:
#   GROQ_API_KEY:
#     file: ./secrets/groq_api_key.txt
#   AISSTREAM_API_KEY:
#     file: ./secrets/aisstream_api_key.txt
#   FINNHUB_API_KEY:
#     file: ./secrets/finnhub_api_key.txt
#   FRED_API_KEY:
#     file: ./secrets/fred_api_key.txt
#   NASA_FIRMS_API_KEY:
#     file: ./secrets/nasa_firms_api_key.txt
#   LLM_API_KEY:
#     file: ./secrets/llm_api_key.txt

volumes:
  redis-data:
  chroma-data:
